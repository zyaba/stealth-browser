[project]
name = "stealth-browser"
version = "0.3.1"
description = "Standalone Patchright stealth browser: extensions, temporary/persistent profiles and a CDP port for Chrome DevTools MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "patchright~=1.60",
]

[project.scripts]
stealth-browser = "stealth_browser.mcp_launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src-layout: the package lives in src/stealth_browser, auto-discovered from src.
[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 typing marker so consumers see the annotations.
[tool.setuptools.package-data]
stealth_browser = ["py.typed"]
